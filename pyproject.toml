[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dacode-bootstrap"
version = "0.1.0"
description = "Bootstrap lexer, parser, AST and interpreter for DaCode"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DaCode contributors" }]

[project.scripts]
dacode = "dacode.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
